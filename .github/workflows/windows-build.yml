  name: Build Windows installer

  'on':
    workflow_dispatch:
    push:
      branches:
        - main
        - master

  jobs:
    build-windows-installer:
      runs-on: windows-latest

      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Set up JDK 17
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: '17'

        - name: Set up Gradle
          uses: gradle/actions/setup-gradle@v4

        - name: Build MSI installer
          run: '.\gradlew.bat :composeApp:packageMsi --stacktrace'

        - name: Build EXE installer
          run: '.\gradlew.bat :composeApp:packageExe --stacktrace'

        - name: Upload Windows installers
          uses: actions/upload-artifact@v4
          with:
            name: bkc-windows-installers
            path: |
              composeApp/build/compose/binaries/main/msi/*.msi
              composeApp/build/compose/binaries/main/exe/*.exe
            if-no-files-found: error
